<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Group - Automated Withdrawal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-2xl space-y-6">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h1 class="text-xl font-bold text-red-500">WITHDRAW FUNDS (10% LIMIT)</h1>
            <a href="dashboard.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-3 py-1.5 rounded-lg">BACK</a>
        </div>

        <div class="bg-red-950/40 border border-red-500/30 p-3 rounded-xl text-xs text-red-400 font-semibold">
            ⚠️ You can only withdraw up to 10% of your total balance per month.
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">TRC20 WALLET ADDRESS</label>
                <input type="text" id="withdrawAddress" placeholder="Enter your TRC20 address..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-400 mb-1">WITHDRAWAL AMOUNT ($)</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-lg p-3 text-sm focus:outline-none focus:border-red-500">
            </div>

            <button onclick="submitWithdrawal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg text-sm">
                SUBMIT WITHDRAWAL
            </button>
        </div>

        <p id="withdrawStatus" class="text-xs text-center font-bold"></p>
    </div>

    <script>
        async function submitWithdrawal() {
            const address = document.getElementById('withdrawAddress').value;
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const status = document.getElementById('withdrawStatus');

            if (!address || !amount) {
                status.innerText = '⚠️ Please fill in all fields correctly.';
                status.className = 'text-xs text-center font-bold text-red-500';
                return;
            }

            status.innerText = '⏳ Processing instant automated payout...';
            status.className = 'text-xs text-center font-bold text-yellow-500';
        }
    </script>
</body>
</html>
