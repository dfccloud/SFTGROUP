<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFT Group - Binary Tree Structure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="bg-gray-950 text-white p-4 min-h-screen">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <h1 class="text-xl font-bold text-blue-500">BINARY REFERRAL TREE</h1>
            <a href="dashboard.html" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-3 py-1.5 rounded-lg">BACK TO DASHBOARD</a>
        </div>

        <!-- Binary Visual Structure -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center overflow-x-auto space-y-8">
            <!-- Root Member -->
            <div>
                <div class="inline-block bg-blue-600 text-white p-3 rounded-xl border-2 border-blue-400 font-bold text-sm">
                    👤 YOU (ROOT MEMBER)
                </div>
            </div>

            <!-- Level 1 Branches -->
            <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
                <!-- Left Branch -->
                <div class="space-y-4">
                    <div class="text-xs font-bold text-green-400">LEFT WING</div>
                    <div id="leftMember" class="bg-gray-950 border border-green-500/40 p-3 rounded-xl text-xs font-mono">
                        EMPTY / READY
                    </div>
                </div>

                <!-- Right Branch -->
                <div class="space-y-4">
                    <div class="text-xs font-bold text-purple-400">RIGHT WING</div>
                    <div id="rightMember" class="bg-gray-950 border border-purple-500/40 p-3 rounded-xl text-xs font-mono">
                        EMPTY / READY
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
